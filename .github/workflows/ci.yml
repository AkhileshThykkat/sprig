name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: make all test
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build/sprig CXXFLAGS="-O2 -arch arm64 -arch x86_64"
      - run: ./build/sprig help && ./build/sprig emit idle
